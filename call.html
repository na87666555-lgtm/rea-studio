<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14122b">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>वीडियो कॉल · Rea Studio</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/call.css">
  <script type="module" src="js/call.js"></script>
</head>
<body class="call-page">
  <main class="call-shell">
    <nav><a href="./"><img src="icons/icon.svg" width="26" height="26" alt=""> Rea Studio</a></nav>
    <h1>वीडियो कॉल</h1>
    <div class="call-stage">
      <figure><video id="local" autoplay muted playsinline></video><figcaption>आप</figcaption></figure>
      <figure><video id="remote" autoplay playsinline></video><figcaption>दूसरा सदस्य</figcaption></figure>
    </div>
    <p id="status" role="status">कॉल बनाएँ या मिले हुए निमंत्रण से जुड़ें।</p>
    <p id="their-recording" role="status" hidden>दूसरा सदस्य कॉल रिकॉर्ड कर रहा है।</p>
    <section id="setup" class="call-panel" aria-label="कॉल शुरू करें">
      <button id="create" class="btn primary">कॉल बनाएँ</button>
      <details id="invitation-entry"><summary>मेरे पास निमंत्रण है</summary>
        <label for="invitation">निमंत्रण लिंक</label>
        <textarea id="invitation" rows="2" spellcheck="false" autocapitalize="off"></textarea>
        <button id="join" class="btn">निमंत्रण स्वीकार करें</button>
      </details>
    </section>
    <section id="exchange" class="call-panel" aria-label="कनेक्शन साझा करें" hidden>
      <label id="out-label" for="outgoing"></label>
      <textarea id="outgoing" rows="2" readonly spellcheck="false"></textarea>
      <div class="call-actions"><button id="share" class="btn" hidden>साझा करें</button><button id="copy" class="btn">कॉपी करें</button></div>
      <div id="reply-area" hidden>
        <label for="reply">दूसरे सदस्य का जवाब यहाँ पेस्ट करें</label>
        <textarea id="reply" rows="2" spellcheck="false" autocapitalize="off"></textarea>
        <button id="accept" class="btn primary">कॉल जोड़ें</button>
      </div>
    </section>
    <div class="call-actions">
      <button id="unmute" class="btn" hidden>दूसरे सदस्य की आवाज़ सुनें</button>
      <button id="record" class="btn" hidden>कॉल रिकॉर्ड करें</button>
      <button id="end" class="btn" hidden>कॉल समाप्त करें</button>
      <a id="download" class="btn" hidden>रिकॉर्डिंग डाउनलोड करें</a>
    </div>
    <p class="call-help" id="record-help" hidden>रिकॉर्ड करने से पहले दूसरे सदस्य की अनुमति लें।</p>
  </main>
</body>
</html>
